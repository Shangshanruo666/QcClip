name: 同步 QcClip GitHub Releases 到 Gitee

on:
  release:
    # 不处理 deleted：删除 Gitee Release 会连同手动上传的附件一起删除。
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的版本标签，例如 v1.0.0-beta.4；只同步版本信息，不处理附件'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mosheng1/QcClip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITEE_REPO: mk-mo-sheng/QcClip
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SYNC_TAG: ${{ inputs.tag || '' }}

    steps:
      - name: 检出代码和标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 Gitee 令牌
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo '未配置 GITEE_TOKEN，请在仓库 Settings > Secrets and variables > Actions 中添加 Gitee 私人令牌。' >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 4 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 60 \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" \
            'https://gitee.com/api/v5/user')"
          if [[ "${status}" != '200' ]]; then
            echo "Gitee 令牌校验失败，HTTP 状态码：${status}" >&2
            exit 1
          fi

      - name: 推送发布标签到 Gitee
        shell: bash
        run: |
          set -euo pipefail
          remote="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            tag="${SYNC_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
            echo "仓库中没有标签：${tag}" >&2
            exit 1
          fi
          git push --quiet "${remote}" "refs/tags/${tag}:refs/tags/${tag}"

      # 只同步版本信息，附件在 Gitee 手动上传；已存在的附件保留。
      - name: 同步发布说明
        shell: bash
        run: python3 .github/scripts/sync-gitee-releases.py
